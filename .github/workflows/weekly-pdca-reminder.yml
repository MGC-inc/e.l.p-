name: weekly-pdca-reminder

# 週次PDCA（weekly-shuuji.yml配信）に未回答のまま数日経った人へ、記入テンプレの
# リマインドを1通LINEで送る（商談分析運用.md 8章参照。実データで「15人中半数以上が
# 無回答のまま」と判明したため追加）。
#
# 水曜配信から3日後の土曜9:00 JSTに実行する。Claude／LLMを一切経由しない決定的コード
# （tools/shuuji/pdca_reminder.py）。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true=送信せず対象者だけ表示"
        type: boolean
        default: false
  schedule:
    - cron: "0 0 * * 6"  # 土曜 00:00 UTC = 土曜 09:00 JST

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: 未回答者へリマインド配信
        env:
          DEAL_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.DEAL_LINE_CHANNEL_ACCESS_TOKEN }}
          IMAGAWA_LINE_USER_ID: ${{ secrets.IMAGAWA_LINE_USER_ID }}
          ELP_SUPABASE_URL: ${{ secrets.ELP_SUPABASE_URL }}
          ELP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ELP_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 tools/shuuji/pdca_reminder.py --dry-run
          else
            python3 tools/shuuji/pdca_reminder.py
          fi
