name: trouble-digest

# 毎日の終礼（19:30 JST）に、Notion「🆘 困ったメモ」を今川さんのLINEへまとめて送る（scripts/trouble_digest.py）。
# 新しいメモも未回答のメモも0件の日は何も送らない。Claude／LLMを経由しない決定的コード。
#   毎日 10:15 UTC = 19:15 JST（GitHub Actionsの定刻起動は数分〜十数分遅れるため、19:30の終礼に間に合うよう早めに起動する）
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true=送信せず内容だけ表示する"
        type: boolean
        default: true
  schedule:
    - cron: "15 10 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 困ったメモを終礼前に今川さんへ
        env:
          DEAL_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.DEAL_LINE_CHANNEL_ACCESS_TOKEN }}
          IMAGAWA_LINE_USER_ID: ${{ secrets.IMAGAWA_LINE_USER_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ELP_SUPABASE_URL: ${{ secrets.ELP_SUPABASE_URL }}
          ELP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ELP_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          python3 scripts/trouble_digest.py $ARGS
