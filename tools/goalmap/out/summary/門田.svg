x="48" y="330" font-size="12" fill="#1F2933">母数が少ない日ほど焦ってトーク量を増やさず、間を取って温度…</text><rect x="30" y="336" width="13" height="13" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.4"/><text x="48" y="346" font-size="12" fill="#1F2933">【今週の1点】在宅→対面の突破：玄関で雑談1テーマ→距離を…</text><circle cx="18" cy="373" r="5.5" fill="#9AA3AD"/><text x="30" y="377" font-size="13" font-weight="700" fill="#1F2933">④振り返り</text><rect x="330" y="364" width="88" height="19" rx="9.5" fill="#F2F4F6" stroke="#9AA3AD"/><text x="374" y="377" text-anchor="middle" font-size="11" font-weight="700" fill="#9AA3AD">—</text><rect x="30" y="386" width="13" height="13" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.4"/><text x="48" y="396" font-size="12" fill="#1F2933">（タスクなし）</text><circle cx="18" cy="423" r="5.5" fill="#9AA3AD"/><text x="30" y="427" font-size="13" font-weight="700" fill="#1F2933">⑤自走</text><rect x="330" y="414" width="88" height="19" rx="9.5" fill="#F2F4F6" stroke="#9AA3AD"/><text x="374" y="427" text-anchor="middle" font-size="11" font-weight="700" fill="#9AA3AD">—</text><rect x="30" y="436" width="13" height="13" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.4"/><text x="48" y="446" font-size="12" fill="#1F2933">（タスクなし）</text></svg>