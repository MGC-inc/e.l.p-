op offset="1" stop-color="#4353C0"/></linearGradient><linearGradient id="drgGld" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F9DC74"/><stop offset="0.45" stop-color="#EEB53A"/><stop offset="1" stop-color="#B87A12"/></linearGradient><linearGradient id="eggG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF9E8"/><stop offset="1" stop-color="#EFD9A8"/></linearGradient><radialGradient id="glowG"><stop offset="0" stop-color="#FFE9A0" stop-opacity="0.75"/><stop offset="1" stop-color="#FFE9A0" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="430" height="522" fill="#fff"/><text x="12" y="22" font-size="16" font-weight="700" fill="#1F2933">古賀（新人）</text><text x="12" y="40" font-size="11.5" fill="#67707A">アポの型を習得する（新人立ち上げ）</text><text x="418" y="22" text-anchor="end" font-size="17" font-weight="700" fill="#1D9E75">達成率 0%</text><rect x="280" y="30" width="138" height="8" rx="4" fill="#F2F4F6"/><rect x="280" y="30" width="0" height="8" rx="4" fill="#1D9E75"/><rect x="12" y="48" width="270" height="64" rx="10" fill="url(#goalGrad)" stroke="#FFD36E" stroke-width="2"/><rect x="12" y="48" width="270" height="32.0" rx="10" fill="#fff" opacity="0.16"/><text x="24" y="68" font-size="12" font-weight="700" fill="#fff">ゴール</text><polygon points="267.0,56.0 268.4,60.6 273.0,62.0 268.4,63.4 267.0,68.0 265.6,63.4 261.0,62.0 265.6,60.6" fill="#FFF1B8"/><text x="24" y="88" font-size="14" font-weight="600" fill="#fff">工事挨拶〜アポ取得までの基本トークを</text><text x="24" y="105" font-size="14" font-weight="600" fill="#fff">マニュアルなしで一通り回せ、毎日アポ</text><g transform="translate(350,80) scale(1.3)"><ellipse cx="0" cy="20" rx="11" ry="2.2" fill="#1F2933" opacity="0.08"/><ellipse cx="0" cy="0" rx="15" ry="19" fill="url(#eggG)"/><ellipse cx="0" cy="0" rx="15" ry="19" fill="none" stroke="#E2D2A0" stroke-width="1.3"/><path d="M-7.5,-9 C-9.5,-4 -9.5,3 -7.5,8" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/><circle cx