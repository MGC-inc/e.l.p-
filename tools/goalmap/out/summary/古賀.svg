th="13" height="13" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.4"/><text x="48" y="296" font-size="12" fill="#1F2933">基本トークをロープレで繰り返す</text><circle cx="18" cy="323" r="5.5" fill="#9AA3AD"/><text x="30" y="327" font-size="13" font-weight="700" fill="#1F2933">③実践</text><rect x="330" y="314" width="88" height="19" rx="9.5" fill="#F2F4F6" stroke="#9AA3AD"/><text x="374" y="327" text-anchor="middle" font-size="11" font-weight="700" fill="#9AA3AD">—</text><rect x="30" y="336" width="13" height="13" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.4"/><text x="48" y="346" font-size="12" fill="#1F2933">指導つきで商談に同席し、一部を担当する</text><rect x="30" y="352" width="13" height="13" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.4"/><text x="48" y="362" font-size="12" fill="#1F2933">商談後に良かった点・詰まった点を記録する</text><circle cx="18" cy="389" r="5.5" fill="#9AA3AD"/><text x="30" y="393" font-size="13" font-weight="700" fill="#1F2933">④振り返り</text><rect x="330" y="380" width="88" height="19" rx="9.5" fill="#F2F4F6" stroke="#9AA3AD"/><text x="374" y="393" text-anchor="middle" font-size="11" font-weight="700" fill="#9AA3AD">—</text><rect x="30" y="402" width="13" height="13" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.4"/><text x="48" y="412" font-size="12" fill="#1F2933">つまずきポイントを先輩と確認する</text><rect x="30" y="418" width="13" height="13" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.4"/><text x="48" y="428" font-size="12" fill="#1F2933">週次で自分の商談を振り返る</text><circle cx="18" cy="455" r="5.5" fill="#9AA3AD"/><text x="30" y="459" font-size="13" font-weight="700" fill="#1F2933">⑤自走</text><rect x="330" y="446" width="88" height="19" rx="9.5" fill="#F2F4F6" stroke="#9AA3AD"/><text x="374" y="459" text-anchor="middle" font-size="11" font-weight="700" fill="#9AA3AD">—</text><rect x="30" y="468" width="13" height="13" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.4"/><text x="48" y="478" font-size="12" fill="#1F2933">指導なしで１商談を最後まで担当する</text><rect x="30" y="484" width="13" 