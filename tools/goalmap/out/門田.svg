<path d="M114,528 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="142" y="530" font-size="14" font-weight="700" fill="#1F2933">②練習</text>
<text x="142" y="548" font-size="11" fill="#67707A">完了：苦手ケースでも型どおり実</text>
<text x="142" y="563" font-size="11" fill="#67707A">行できる</text>
<rect x="16" y="534.0" width="80" height="22" rx="11" fill="#E7F5EF" stroke="#1D9E75" stroke-width="1"/>
<text x="56.0" y="549.0" text-anchor="middle" font-size="11" font-weight="700" fill="#1D9E75">クリア</text>
<rect x="360" y="515" width="14" height="14" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.5"/>
<text x="382" y="526" font-size="12.5" fill="#1F2933">怖しいネックを先出しで潰すのをやめ、「当たり</text>
<text x="382" y="541" font-size="12.5" fill="#1F2933">前ベースで聞かれたら答える」スタンスをロー…</text>
<line x1="235.0" y1="608" x2="235.0" y2="588" stroke="#9AA3AD" stroke-width="2"/>
<path d="M230.0,590 L235.0,584 L240.0,590 Z" fill="#9AA3AD"/>
<rect x="130" y="608" width="210" height="74" rx="10" fill="#E7F5EF" stroke="#1D9E75" stroke-width="1"/>
<circle cx="118" cy="628" r="9" fill="#1D9E75"/>
<path d="M114,628 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="142" y="630" font-size="14" font-weight="700" fill="#1F2933">①型を知る</text>
<text x="142" y="648" font-size="11" fill="#67707A">完了：自分の勝ち負け・型を言語</text>
<text x="142" y="663" font-size="11" fill="#67707A">化できる</text>
<rect x="16" y="634.0" width="80" height="22" rx="11" fill="#E7F5EF" stroke="#1D9E75" stroke-width="1"/>
<text x="56.0" y="649.0" text-anchor="middle" font-size="11" font-weight="700" fill="#1D9E75">クリア</text>
<rect x="360" y="615" width="14" height="14" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.5"/>
<text x="382" y="626" font-size="12.5" fill="#1F2933">ガス家への玄関突破ワードを他メンバーから収集</text>
<text x="382" y="641" font-size="12.5" fill="#1F2933">し、自分の入りトークに加える</text>
