<rect x="0" y="0" width="680" height="736" fill="#FFFFFF"/>
<text x="20" y="34" font-size="13" font-weight="700" fill="#1F2933">門田（クローザー）｜焦らず雑談で距離を縮め、当たり前ベースで主導権を握り温度感を保って取り切る</text>
