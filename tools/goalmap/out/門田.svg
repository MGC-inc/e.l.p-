<circle cx="118" cy="382" r="9" fill="#EF9F27"/>
<text x="142" y="384" font-size="14" font-weight="700" fill="#1F2933">③実践</text>
<text x="142" y="402" font-size="11" fill="#67707A">完了：商談で意図的に型を使えて</text>
<text x="142" y="417" font-size="11" fill="#67707A">いる</text>
<rect x="16" y="411.0" width="80" height="22" rx="11" fill="#FDF3E2" stroke="#EF9F27" stroke-width="1"/>
<text x="56.0" y="426.0" text-anchor="middle" font-size="11" font-weight="700" fill="#EF9F27">—</text>
<rect x="360" y="369" width="14" height="14" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.5"/>
<text x="382" y="380" font-size="12.5" fill="#1F2933">工事挨拶直後にサービス提示せず、雑談1テーマ</text>
<text x="382" y="395" font-size="12.5" fill="#1F2933">で距離を縮めてから提示する</text>
<rect x="360" y="405" width="14" height="14" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.5"/>
<text x="382" y="416" font-size="12.5" fill="#1F2933">母数が少ない日ほど焦ってトーク量を増やさず、</text>
<text x="382" y="431" font-size="12.5" fill="#1F2933">間を取って温度感を上げてから日程切りする</text>
<rect x="360" y="441" width="14" height="14" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.5"/>
<text x="382" y="452" font-size="12.5" fill="#1F2933">【今週の1点】在宅→対面の突破：玄関で雑談1</text>
<text x="382" y="467" font-size="12.5" fill="#1F2933">テーマ→距離を縮める（対面率47%→65%）</text>
<line x1="235.0" y1="508" x2="235.0" y2="488" stroke="#9AA3AD" stroke-width="2"/>
<path d="M230.0,490 L235.0,484 L240.0,490 Z" fill="#9AA3AD"/>
<rect x="130" y="508" width="210" height="74" rx="10" fill="#E7F5EF" stroke="#1D9E75" stroke-width="1"/>
