<text x="142" y="284" font-size="14" font-weight="700" fill="#1F2933">④振り返り</text>
<text x="142" y="302" font-size="11" fill="#67707A">完了：うまくいった／詰まった点</text>
<text x="142" y="317" font-size="11" fill="#67707A">を言語化できる</text>
