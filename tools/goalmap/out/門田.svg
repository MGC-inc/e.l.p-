<text x="144" y="90" font-size="12" font-weight="700" fill="#FFFFFF">ゴール</text>
<polygon points="324.0,79.0 325.4,83.6 330.0,85.0 325.4,86.4 324.0,91.0 322.6,86.4 318.0,85.0 322.6,83.6" fill="#FFF1B8"/>
<text x="144" y="108" font-size="13" font-weight="600" fill="#FFFFFF">取れない焦りで一方的に話さず、</text>
<text x="144" y="124" font-size="13" font-weight="600" fill="#FFFFFF">挨拶・雑談で距離を縮めてから当</text>
<text x="144" y="140" font-size="13" font-weight="600" fill="#FFFFFF">たり前ベースで主導権を握り、…</text>
