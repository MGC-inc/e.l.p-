<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 755" font-family="Hiragino Sans, 'Noto Sans CJK JP', 'Yu Gothic', sans-serif" width="680" height="755">
<defs><linearGradient id="goalGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B4BE0"/><stop offset="0.5" stop-color="#B14BE0"/><stop offset="1" stop-color="#FFC24B"/></linearGradient><linearGradient id="phx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE259"/><stop offset="0.5" stop-color="#FF9A00"/><stop offset="1" stop-color="#FF3D00"/></linearGradient><linearGradient id="phx2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF0A0"/><stop offset="1" stop-color="#FF7A00"/></linearGradient><linearGradient id="hen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#37C9B0"/><stop offset="0.6" stop-color="#3DA0E8"/><stop offset="1" stop-color="#7A5BE0"/></linearGradient><linearGradient id="pcock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2BD0C0"/><stop offset="0.55" stop-color="#2E8FD0"/><stop offset="1" stop-color="#2E4BB0"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF0A8"/><stop offset="0.5" stop-color="#F2C230"/><stop offset="1" stop-color="#C8901A"/></linearGradient></defs>
<rect x="0" y="0" width="680" height="755" fill="#FFFFFF"/>
<text x="20" y="34" font-size="13" font-weight="700" fill="#1F2933">今川（管理）｜チーム・代理店の「売れる仕組み」を構築し、事業部売上を過去最高へ（マネジメント）</text>
<text x="660" y="26" text-anchor="end" font-size="13" fill="#67707A">達成率</text>
<text x="462" y="50" text-anchor="end" font-size="20" font-weight="700" fill="#1D9E75">0%</text>
<rect x="470" y="38" width="150" height="12" rx="6" fill="#F2F4F6"/>
<rect x="470" y="38" width="0" height="12" rx="6" fill="#1D9E75"/>
<rect x="130" y="70" width="210" height="81" rx="10" fill="url(#goalGrad)" stroke="#FFD36E" stroke-width="2.5"/>
<rect x="130" y="70" width="210" height="40.5" rx="10" fill="#FFFFFF" opacity="0.16"/>
<text x="144" y="90" font-size="12" font-weight="700" fill="#FFFFFF">ゴール</text>
<polygon points="324.0,79.0 325.4,83.6 330.0,85.0 325.4,86.4 324.0,91.0 322.6,86.4 318.0,85.0 322.6,83.6" fill="#FFF1B8"/>
<text x="144" y="108" font-size="13" font-weight="600" fill="#FFFFFF">自分が営業の基準となる行動を継</text>
<text x="144" y="124" font-size="13" font-weight="600" fill="#FFFFFF">続でき、メンバーが迷わず実践で</text>
<text x="144" y="140" font-size="13" font-weight="600" fill="#FFFFFF">きる営業フロー・商材・管理体…</text>
<rect x="16" y="99.5" width="80" height="22" rx="11" fill="#FFF3D6" stroke="#B7791F" stroke-width="1"/>
<text x="56.0" y="114.5" text-anchor="middle" font-size="11" font-weight="700" fill="#B7791F">達成</text>
<ellipse cx="402.0" cy="116.0" rx="25.5" ry="32.3" fill="#FFF3D6"/><ellipse cx="402.0" cy="116.0" rx="25.5" ry="32.3" fill="none" stroke="#E2D2A0" stroke-width="2.4"/><circle cx="393.5" cy="110.9" r="2.5" fill="#E6D3A0"/><circle cx="410.5" cy="124.5" r="2.2" fill="#E6D3A0"/><circle cx="403.7" cy="134.7" r="2.0" fill="#E6D3A0"/>
<text x="448" y="113" font-size="13" font-weight="700" fill="#1F2933">あと2コで進化</text>
<text x="448" y="131" font-size="11" fill="#67707A">餌 0/2　累計 0/10</text>
<text x="16" y="62" font-size="10" fill="#67707A">目標時期</text>
<line x1="235.0" y1="177" x2="235.0" y2="157" stroke="#9AA3AD" stroke-width="2"/>
<path d="M230.0,159 L235.0,153 L240.0,159 Z" fill="#9AA3AD"/>
<rect x="130" y="177" width="210" height="84" rx="10" fill="#F2F4F6" stroke="#9AA3AD" stroke-width="1"/>
<circle cx="118" cy="197" r="9" fill="#9AA3AD"/>
<text x="142" y="199" font-size="14" font-weight="700" fill="#1F2933">⑤自走</text>
<text x="142" y="217" font-size="11" fill="#67707A">完了：指導なしで型を回せる</text>
<rect x="16" y="208.0" width="80" height="22" rx="11" fill="#F2F4F6" stroke="#9AA3AD" stroke-width="1"/>
<text x="56.0" y="223.0" text-anchor="middle" font-size="11" font-weight="700" fill="#9AA3AD">—</text>
<rect x="360" y="184" width="14" height="14" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.5"/>
<text x="382" y="195" font-size="12.5" fill="#1F2933">チームが自走できるよう、週次レビュー・KPI</text>
<text x="382" y="210" font-size="12.5" fill="#1F2933">管理・教育の運用ルールを定着させる</text>
<rect x="360" y="220" width="14" height="14" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.5"/>
<text x="382" y="231" font-size="12.5" fill="#1F2933">代理店がそのまま使える営業マニュアル・資料・</text>
<text x="382" y="246" font-size="12.5" fill="#1F2933">教育フローを完成させる</text>
<line x1="235.0" y1="287" x2="235.0" y2="267" stroke="#9AA3AD" stroke-width="2"/>
<path d="M230.0,269 L235.0,263 L240.0,269 Z" fill="#9AA3AD"/>
<rect x="130" y="287" width="210" height="84" rx="10" fill="#F2F4F6" stroke="#9AA3AD" stroke-width="1"/>
<circle cx="118" cy="307" r="9" fill="#9AA3AD"/>
<text x="142" y="309" font-size="14" font-weight="700" fill="#1F2933">④振り返り</text>
<text x="142" y="327" font-size="11" fill="#67707A">完了：うまくいった／詰まった点</text>
<text x="142" y="342" font-size="11" fill="#67707A">を言語化できる</text>
<rect x="16" y="318.0" width="80" height="22" rx="11" fill="#F2F4F6" stroke="#9AA3AD" stroke-width="1"/>
<text x="56.0" y="333.0" text-anchor="middle" font-size="11" font-weight="700" fill="#9AA3AD">—</text>
<rect x="360" y="294" width="14" height="14" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.5"/>
<text x="382" y="305" font-size="12.5" fill="#1F2933">商材改善・営業改善によって起きた変化を振り返</text>
<text x="382" y="320" font-size="12.5" fill="#1F2933">り、残る課題を整理する</text>
<rect x="360" y="330" width="14" height="14" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.5"/>
<text x="382" y="341" font-size="12.5" fill="#1F2933">クーリングオフ・審査落ちについて再度分析し、</text>
<text x="382" y="356" font-size="12.5" fill="#1F2933">営業プロセスへ改善策を反映する</text>
<line x1="235.0" y1="397" x2="235.0" y2="377" stroke="#9AA3AD" stroke-width="2"/>
<path d="M230.0,379 L235.0,373 L240.0,379 Z" fill="#9AA3AD"/>
<rect x="130" y="397" width="210" height="84" rx="10" fill="#F2F4F6" stroke="#9AA3AD" stroke-width="1"/>
<circle cx="118" cy="417" r="9" fill="#9AA3AD"/>
<text x="142" y="419" font-size="14" font-weight="700" fill="#1F2933">③実践</text>
<text x="142" y="437" font-size="11" fill="#67707A">完了：商談で意図的に型を使えて</text>
<text x="142" y="452" font-size="11" fill="#67707A">いる</text>
<rect x="16" y="428.0" width="80" height="22" rx="11" fill="#F2F4F6" stroke="#9AA3AD" stroke-width="1"/>
<text x="56.0" y="443.0" text-anchor="middle" font-size="11" font-weight="700" fill="#9AA3AD">—</text>
<rect x="360" y="404" width="14" height="14" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.5"/>
<text x="382" y="415" font-size="12.5" fill="#1F2933">自ら現場で改善した営業を実践し、成功・失敗事</text>
<text x="382" y="430" font-size="12.5" fill="#1F2933">例をチームへ共有する</text>
<rect x="360" y="440" width="14" height="14" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.5"/>
<text x="382" y="451" font-size="12.5" fill="#1F2933">メンバーの商談同行・レビューを行い、改善点を</text>
<text x="382" y="466" font-size="12.5" fill="#1F2933">その場でフィードバックする</text>
<line x1="235.0" y1="507" x2="235.0" y2="487" stroke="#9AA3AD" stroke-width="2"/>
<path d="M230.0,489 L235.0,483 L240.0,489 Z" fill="#9AA3AD"/>
<rect x="130" y="507" width="210" height="84" rx="10" fill="#F2F4F6" stroke="#9AA3AD" stroke-width="1"/>
<circle cx="118" cy="527" r="9" fill="#9AA3AD"/>
<text x="142" y="529" font-size="14" font-weight="700" fill="#1F2933">②練習</text>
<text x="142" y="547" font-size="11" fill="#67707A">完了：苦手ケースでも型どおり実</text>
<text x="142" y="562" font-size="11" fill="#67707A">行できる</text>
<rect x="16" y="538.0" width="80" height="22" rx="11" fill="#F2F4F6" stroke="#9AA3AD" stroke-width="1"/>
<text x="56.0" y="553.0" text-anchor="middle" font-size="11" font-weight="700" fill="#9AA3AD">—</text>
<rect x="360" y="514" width="14" height="14" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.5"/>
<text x="382" y="525" font-size="12.5" fill="#1F2933">商材・提案資料・営業トークを改善し、実際の営</text>
<text x="382" y="540" font-size="12.5" fill="#1F2933">業で使える形まで完成させる</text>
<rect x="360" y="550" width="14" height="14" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.5"/>
<text x="382" y="561" font-size="12.5" fill="#1F2933">メンバーとロープレ・営業レビューを実施し、新</text>
<text x="382" y="576" font-size="12.5" fill="#1F2933">しい営業フローを全員で試す</text>
<line x1="235.0" y1="617" x2="235.0" y2="597" stroke="#9AA3AD" stroke-width="2"/>
<path d="M230.0,599 L235.0,593 L240.0,599 Z" fill="#9AA3AD"/>
<rect x="130" y="617" width="210" height="84" rx="10" fill="#FDF3E2" stroke="#EF9F27" stroke-width="2"/>
<circle cx="118" cy="637" r="9" fill="#EF9F27"/>
<text x="142" y="639" font-size="14" font-weight="700" fill="#1F2933">①型を知る</text>
<text x="142" y="657" font-size="11" fill="#67707A">完了：自分の勝ち負け・型を言語</text>
<text x="142" y="672" font-size="11" fill="#67707A">化できる</text>
<rect x="16" y="648.0" width="80" height="22" rx="11" fill="#FDF3E2" stroke="#EF9F27" stroke-width="1"/>
<text x="56.0" y="663.0" text-anchor="middle" font-size="11" font-weight="700" fill="#EF9F27">—</text>
<rect x="360" y="624" width="14" height="14" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.5"/>
<text x="382" y="635" font-size="12.5" fill="#1F2933">現在の営業フロー（集客～契約～工事）を書き出</text>
<text x="382" y="650" font-size="12.5" fill="#1F2933">し、「改善すべきポイント」を整理する</text>
<rect x="360" y="660" width="14" height="14" rx="3" fill="#fff" stroke="#9AA3AD" stroke-width="1.5"/>
<text x="382" y="671" font-size="12.5" fill="#1F2933">クーリングオフ・審査落ち・失注を案件ごとに振</text>
<text x="382" y="686" font-size="12.5" fill="#1F2933">り返り、原因をカテゴリ化する</text>
